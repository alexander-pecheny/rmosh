[package]
name = "mosh"
description = "The mosh launcher: starts a server over ssh and hands off to the client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "mosh"
path = "src/lib.rs"

[[bin]]
name = "mosh"
path = "src/main.rs"

[dependencies]
mosh-pipe = { path = "../mosh-pipe" }
mosh-sys = { path = "../mosh-sys" }
