syntax = "proto2";

package HostBuffers;

// Upstream declares hostbytes/resize/echoack as proto2 extensions of an empty
// Instruction. An extension field is encoded exactly like a normal field of the same
// number and wire type, so inlining them here produces identical bytes while staying
// within the subset prost implements. See ADR notes in CONTEXT.md on the Wire Contract.
message HostMessage {
  repeated Instruction instruction = 1;
}

message Instruction {
  optional HostBytes hostbytes = 2;
  optional ResizeMessage resize = 3;
  optional EchoAck echoack = 7;
}

message HostBytes {
  optional bytes hoststring = 4;
}

message ResizeMessage {
  optional int32 width = 5;
  optional int32 height = 6;
}

message EchoAck {
  optional uint64 echo_ack_num = 8;
}
