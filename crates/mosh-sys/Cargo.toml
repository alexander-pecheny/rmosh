[package]
name = "mosh-sys"
description = "The single crate permitted to contain unsafe: FFI that no safe wrapper provides."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true
# Only iOS uses it (see locale/ios.rs); unconditional so the host can run its tests.
unicode-width = "0.2"

[features]
# Enabled when libutempter is available, matching --with-utempter in configure.ac.
utempter = []

[build-dependencies]
pkg-config = "0.3"
